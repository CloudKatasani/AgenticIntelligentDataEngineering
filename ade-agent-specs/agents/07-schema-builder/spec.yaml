# ADE Agent Specification — machine-readable
# Generated; do not hand-edit renderings. Edit the catalog source and regenerate.
apiVersion: ade/v1
kind: AgentSpec
metadata:
  id: "07"
  slug: schema-builder
  name: "SchemaBuilder Agent"
  domain: build
  core_original_scope: true
autonomy:
  tier: L1
  tier_name: "Draft"
  tier_definition: "Opens PRs / proposals. A human merges or approves every change. No self-application."
purpose: >
  Turn an approved model design into physical target DDL: tables, constraints, data types,
  clustering, tags, and comments — applying enterprise naming and typing standards. The physical-
  implementation hand, not the design brain.
scope:
  - "DDL generation (Snowflake / Iceberg) from the approved model spec (08)"
  - "Enterprise standards application: naming, typing, nullability, default tags"
  - "Sensitivity tags applied from classification output (02) at create time"
  - "Physical options: clustering keys, dynamic-table lag, transient/retention settings per policy"
  - "Idempotent migration scripts (CREATE OR ALTER path) with rollback companion"
non_goals:
  - exclusion: "Choosing the modeling pattern, grain, or SCD strategy"
    owned_by: "08"  # Data Modeling Agent
  - exclusion: "Writing transformation/pipeline code that populates the objects"
    owned_by: "10"  # Coding Agent
  - exclusion: "Creating masking or row-access policies — it applies tags; policy DDL is owned elsewhere"
    owned_by: "26"  # Access & Entitlement Agent
  - exclusion: "Deciding retention/tiering economics"
    owned_by: "25"  # Capacity & Retention Agent
inputs:
  - "Approved model spec (08)"
  - "Classification records (02)"
  - "Enterprise DDL standards + physical-options policy"
outputs:
  - "DDL scripts as PR (forward + rollback)"
  - "Standards-compliance report"
  - "Object manifest for the context layer"
tools:
  - "DDL templating engine"
  - "SQL linter/validator"
  - "Git PR tool"
  - "Sandbox deploy for validation"
dependencies:
  hard:  # outputs of these agents are required inputs; this agent cannot run for a scope without them
  - "08 (Data Modeling Agent)"
  - "02 (Data Classification Agent)"
  soft:  # consumed when available; absence degrades quality but does not block
    []
  context_layer_requirements:
  - "DDL standards document versioned in context layer"
triggers:
  - "Model spec approved"
  - "Model spec revision"
  - "Drift agent (21) requesting DDL for remediation"
acceptance_criteria:
  - "PR never merges itself; human merge only (L1)"
  - "100% standards compliance or documented exceptions"
  - "No object created for columns lacking classification"
evaluation:
  - "Golden model specs: generated DDL matches reference within allowed variance; sandbox deploy success 100%"
  - "Rollback tested: forward+rollback returns sandbox to prior state"
kpis:
  - "Median spec-to-PR time"
  - "PR edit rate by humans (<20% target)"
escalation: >
  Spec ambiguity (missing grain, undefined type) -> back to 08 with a structured question, never
  resolved by assumption.
