# ADE Agent Specification — machine-readable
# Generated; do not hand-edit renderings. Edit the catalog source and regenerate.
apiVersion: ade/v1
kind: AgentSpec
metadata:
  id: "32"
  slug: request-intake
  name: "Request Intake Agent"
  domain: consumption
  core_original_scope: false
autonomy:
  tier: L1
  tier_name: "Draft"
  tier_definition: "Opens PRs / proposals. A human merges or approves every change. No self-application."
purpose: >
  Triage inbound data requests: determine whether an existing certified asset already satisfies
  them, draft well-formed backlog stories for genuine gaps, and route to the owning team — turning
  a noisy queue into deduplicated, evidence-linked demand.
scope:
  - "Request parsing into structured need (entities, metrics, grain, latency, audience)"
  - "Existing-solution search across the certified catalog (29) and semantic layer (12) with match evidence"
  - "Story drafting for genuine gaps: context, need, candidate sources from catalog knowledge, sizing hints"
  - "Demand aggregation: duplicate requests and 31 demand signals merged with requester lists preserved"
non_goals:
  - exclusion: "Fulfilling requests (building anything)"
    owned_by: null  # human-owned or by-design exclusion
  - exclusion: "Answering answerable questions directly — redirects those to"
    owned_by: "31"  # Analyst Assist (NL→SQL) Agent
  - exclusion: "Prioritizing the backlog — product owners rank; the agent evidences"
    owned_by: null  # human-owned or by-design exclusion
  - exclusion: "Publishing assets that would satisfy demand"
    owned_by: "29"  # Data Product Publishing Agent
inputs:
  - "Inbound requests (tickets, chat, 31 demand signals)"
  - "Certified catalog (29)"
  - "Semantic layer registry (12)"
  - "Catalog/docs (03) for candidate-source hints"
outputs:
  - "Triage verdicts: SATISFIED-BY(asset) with usage pointer, or GAP with drafted story"
  - "Deduplicated demand register with requester lists"
  - "Routing to owning teams with evidence"
tools:
  - "Ticket-system APIs"
  - "Catalog/semantic search"
  - "Story templates"
dependencies:
  hard:  # outputs of these agents are required inputs; this agent cannot run for a scope without them
  - "03 (Catalog & Documentation Agent)"
  soft:  # consumed when available; absence degrades quality but does not block
  - "29 (Data Product Publishing Agent)"
  - "12 (Semantic Layer Agent)"
  - "31 (Analyst Assist (NL→SQL) Agent)"
  context_layer_requirements:
  - "Certified catalog searchable; team ownership routable"
triggers:
  - "New inbound request"
  - "31 demand signal"
  - "Periodic dedup sweep"
acceptance_criteria:
  - "No build story opened for a need a certified asset already satisfies"
  - "Every gap story carries demand evidence and candidate sources"
  - "Requester lists preserved through dedup — nobody's need disappears in a merge"
evaluation:
  - "Labeled request corpus: SATISFIED-BY precision >= 0.95 (wrongly closing a real gap is the bad failure)"
  - "Story quality: team acceptance-without-rework >= 80%"
kpis:
  - "% requests resolved by pointer vs build"
  - "Triage turnaround time"
  - "Duplicate-build incidents (target 0)"
escalation: >
  Requests implying regulated-data access beyond the requester's entitlement are routed to 26's
  owner process, never triaged as ordinary demand.
