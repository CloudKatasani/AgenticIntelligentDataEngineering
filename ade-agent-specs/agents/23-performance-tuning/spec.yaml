apiVersion: ade/v1
kind: AgentSpec
metadata:
  id: "23"
  slug: performance-tuning
  name: "Performance Tuning Agent"
  domain: operations
  core_original_scope: false
autonomy:
  tier: L2
  tier_name: "Supervised action"
  tier_definition: "May execute in non-production autonomously; production actions require explicit human approval."
purpose: >
  Analyze query and model runtime behavior; recommend and draft materialization changes,
  incremental strategies, clustering, and join elimination as PRs with before/after evidence. Owns
  latency/runtime engineering; spend attribution stays with 22.
scope:
  - "Hotspot analysis from query profiles and model run history (dbt timing, warehouse queueing)"
  - "Tuning PR drafting: materialization/incremental changes, clustering keys, pruning-friendly rewrites, join elimination"
  - "Before/after evidence: sandbox benchmark per change with runtime and bytes-scanned deltas"
  - "Regression watch on applied tunings"
non_goals:
  - exclusion: "Cost attribution and warehouse policy"
    owned_by: "22"  # FinOps Agent
  - exclusion: "Net-new code from specs"
    owned_by: "10"  # Coding Agent
  - exclusion: "Backfill sequencing when a rebuild is needed — requests plans from"
    owned_by: "24"  # Orchestration & Backfill Agent
  - exclusion: "Retention/tiering changes"
    owned_by: "25"  # Capacity & Retention Agent
inputs:
  - "Query history + profiles"
  - "dbt run artifacts"
  - "22 handoffs (cost hotspots)"
  - "Lineage (04) for materialization-change impact"
outputs:
  - "Tuning PRs with benchmark evidence"
  - "Hotspot register with status"
  - "Post-apply regression reports"
tools:
  - "Query profile analyzers"
  - "Sandbox benchmark harness"
  - "Git PR tool"
  - "Lineage traversal API"
dependencies:
  hard:  # outputs of these agents are required inputs; this agent cannot run for a scope without them
    []
  soft:  # consumed when available; absence degrades quality but does not block
  - "22 (FinOps Agent)"
  - "04 (Lineage Reconstruction Agent)"
  context_layer_requirements:
  - "Sandbox with representative data volumes for meaningful benchmarks"
triggers:
  - "Hotspot threshold crossed"
  - "22 handoff"
  - "Post-release performance regression"
acceptance_criteria:
  - "Every tuning PR has sandbox benchmark evidence"
  - "Minimal-change principle: no speculative rewrites bundled in"
  - "Applied changes watched; regression -> revert PR"
evaluation:
  - "Benchmark honesty: production outcome within 25% of sandbox prediction on >= 80% of applied changes"
  - "Hotspot triage agreement with senior-engineer panel >= 85%"
kpis:
  - "P95 runtime on top-20 workloads"
  - "Regression rate of applied tunings (< 5%)"
escalation: >
  Tunings that require design change (grain, model split) route to 08 as a design question rather
  than being forced at the physical layer.
