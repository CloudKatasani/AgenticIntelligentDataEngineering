# ADE Agent Specification — machine-readable
# Generated; do not hand-edit renderings. Edit the catalog source and regenerate.
apiVersion: ade/v1
kind: AgentSpec
metadata:
  id: "01"
  slug: source-profiling
  name: "Source Profiling Agent"
  domain: discovery
  core_original_scope: false
autonomy:
  tier: L2
  tier_name: "Supervised action"
  tier_definition: "May execute in non-production autonomously; production actions require explicit human approval."
purpose: >
  Connect to a registered source and produce a statistical and structural profile of every table
  and column: cardinality, null ratios, distributions, candidate primary/foreign keys, format
  patterns, volumetrics, and refresh cadence. The profile is the ground truth every downstream
  agent reasons over.
scope:
  - "Column statistics: min/max, null %, distinct count, top-k values, length/format patterns"
  - "Candidate PK/FK inference with confidence scores based on uniqueness and inclusion analysis"
  - "Row volumetrics and load-cadence estimation from timestamps and change history"
  - "Cross-column functional dependency hints (A determines B) for later modeling"
  - "Sampled (not full-scan) profiling with documented sample strategy per table size band"
non_goals:
  - exclusion: "Assigning sensitivity or compliance labels to columns"
    owned_by: "02"  # Data Classification Agent
  - exclusion: "Writing table/column business descriptions"
    owned_by: "03"  # Catalog & Documentation Agent
  - exclusion: "Inferring lineage between systems"
    owned_by: "04"  # Lineage Reconstruction Agent
  - exclusion: "Proposing quality rules or thresholds from the profile"
    owned_by: "16"  # Data Quality Rules Agent
  - exclusion: "Recommending ingestion mechanics for the source"
    owned_by: "15"  # Ingestion Pattern Agent
inputs:
  - "Source connection (read-only service account)"
  - "Source registry entry (system, owner, environment)"
  - "Profiling policy (sample sizes, scan windows, cost cap)"
outputs:
  - "profile.json per table (versioned in context layer)"
  - "Inferred constraint set (candidate keys, FK candidates, not-null candidates)"
  - "Profiling run report with coverage % and skipped objects"
tools:
  - "JDBC/ODBC read-only connector"
  - "Deterministic profiler library (no LLM for statistics)"
  - "Context-layer write API"
dependencies:
  hard:  # outputs of these agents are required inputs; this agent cannot run for a scope without them
    []
  soft:  # consumed when available; absence degrades quality but does not block
    []
  context_layer_requirements:
  - "Source registered with owner + environment tag"
triggers:
  - "New source registered"
  - "Scheduled re-profile (drift in stats)"
  - "Supervisor task: onboard source"
acceptance_criteria:
  - "100% of accessible tables profiled or explicitly listed as skipped with reason"
  - "Every inferred key carries a confidence score and the evidence behind it"
  - "No write, DDL, or full-table export ever issued against the source"
evaluation:
  - "Golden set: 3 sources with known keys/constraints; PK inference precision >= 0.95, FK recall >= 0.85"
  - "Stat accuracy: profiler outputs vs exhaustive computation on small tables, exact match"
kpis:
  - "Profile coverage % of registered estate"
  - "Median time from source registration to complete profile"
escalation: >
  If source access fails or cost cap is hit mid-run, stop, persist partial results marked PARTIAL,
  and open a ticket to the source owner. Never retry with elevated credentials.
