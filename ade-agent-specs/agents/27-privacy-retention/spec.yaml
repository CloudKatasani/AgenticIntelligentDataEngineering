apiVersion: ade/v1
kind: AgentSpec
metadata:
  id: "27"
  slug: privacy-retention
  name: "Privacy & Retention Agent"
  domain: governance
  core_original_scope: false
autonomy:
  tier: L1
  tier_name: "Draft"
  tier_definition: "Opens PRs / proposals. A human merges or approves every change. No self-application."
  cap_note: "Capped at L1 in regulated environments regardless of accuracy."
purpose: >
  Operationalize privacy obligations: map where regulated personal data lives (via 02 + lineage),
  support DSAR/erasure fulfilment with located-data reports and drafted action plans, and verify
  retention compliance against regulatory requirements it owns publishing.
scope:
  - "Regulated-data mapping: subject-data inventory by regulation (GDPR/CCPA/state acts) built from 02 labels + 04 lineage propagation"
  - "DSAR support: locate a subject's data across the estate, produce the located-data report and drafted fulfilment plan"
  - "Erasure planning: deletion/anonymization plans respecting legal holds and referential integrity — execution by humans/20 under approval"
  - "Retention-requirement publication (the regulatory floor/ceiling per data class that 25 consumes) and compliance verification"
non_goals:
  - exclusion: "Classifying columns"
    owned_by: "02"  # Data Classification Agent
  - exclusion: "Storage-economics retention tuning — publishes requirements consumed by"
    owned_by: "25"  # Capacity & Retention Agent
  - exclusion: "Access policy generation"
    owned_by: "26"  # Access & Entitlement Agent
  - exclusion: "Building lineage"
    owned_by: "04"  # Lineage Reconstruction Agent
inputs:
  - "Classification (02)"
  - "Lineage (04) for propagation of personal data into derived assets"
  - "Regulatory requirement library (counsel-owned)"
  - "Legal-hold register"
outputs:
  - "Personal-data inventory maps"
  - "DSAR located-data reports + fulfilment plan drafts"
  - "Erasure plans (drafts) with hold/integrity checks"
  - "Published retention requirements; compliance verification reports"
tools:
  - "Context-layer traversal (labels x lineage)"
  - "Subject-locator query tooling (audited)"
  - "Requirement library reader"
dependencies:
  hard:  # outputs of these agents are required inputs; this agent cannot run for a scope without them
  - "02 (Data Classification Agent)"
  - "04 (Lineage Reconstruction Agent)"
  soft:  # consumed when available; absence degrades quality but does not block
    []
  context_layer_requirements:
  - "Regulatory requirement library maintained by counsel; legal-hold register live"
triggers:
  - "DSAR/erasure request intake"
  - "New regulation/library update"
  - "Compliance verification schedule"
  - "New personal-data classification propagating via lineage"
acceptance_criteria:
  - "The agent never executes deletion — drafts and verification only"
  - "DSAR reports state completeness honestly (known gaps from 04 gap register included)"
  - "Requirement publications versioned and consumable by 25 as constraints"
evaluation:
  - "Seeded subject-data placement: location recall >= 0.98 (misses are compliance failures)"
  - "Hold-conflict detection: 100% on seeded holds"
kpis:
  - "DSAR turnaround time within statutory limit"
  - "Verification exceptions open past SLA (target 0)"
escalation: >
  Any located personal data in an unclassified or ungoverned asset is a priority finding to the
  privacy officer — it indicates a 02/coverage gap upstream.
